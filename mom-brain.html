<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Mom Brain"/>
<title>Mom Brain</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–white: #fdfcfa;
–cream: #f5f2ed;
–ink: #1a1714;
–ink2: #3a3530;
–ink3: #6a6258;
–ink4: #9a9088;
–ink5: #c0b8b0;
–border: #ede9e2;
–border2: #ddd8d0;
}

html, body {
background: #faf8f5;
color: var(–ink);
font-family: ‘DM Sans’, sans-serif;
font-weight: 300;
min-height: 100vh;
overscroll-behavior: none;
}

/* HEADER */
.header {
position: sticky;
top: 0;
z-index: 10;
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 16px 20px 12px;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.header-title { font-family: ‘DM Serif Display’, serif; font-size: 22px; color: var(–ink); letter-spacing: -0.3px; }
.header-sub { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); margin-top: 3px; letter-spacing: 0.5px; }
.view-toggle { display: flex; gap: 6px; }
.toggle-btn {
padding: 7px 14px;
border-radius: 20px;
border: 1px solid var(–border2);
background: transparent;
color: var(–ink4);
font-size: 12px;
font-family: ‘DM Mono’, monospace;
cursor: pointer;
transition: all 0.2s;
-webkit-appearance: none;
}
.toggle-btn.active {
background: var(–ink);
border-color: var(–ink);
color: var(–white);
}

/* CAPTURE VIEW */
.capture { padding: 20px 20px 0; }

.input-card {
background: var(–white);
border: 1.5px solid var(–border);
border-radius: 16px;
padding: 16px;
margin-bottom: 16px;
box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
textarea {
width: 100%;
border: none;
outline: none;
resize: none;
font-size: 16px;
color: var(–ink);
line-height: 1.6;
min-height: 90px;
background: transparent;
font-family: ‘DM Serif Display’, serif;
font-weight: 400;
}
textarea::placeholder { color: var(–ink5); font-style: italic; }

.input-footer {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid var(–border);
}
.input-hint { font-family: ‘DM Mono’, monospace; font-size: 11px; color: var(–ink5); }
.save-btn {
padding: 10px 22px;
border-radius: 10px;
border: none;
background: var(–ink);
color: var(–white);
font-size: 14px;
font-family: ‘DM Sans’, sans-serif;
cursor: pointer;
transition: all 0.2s;
-webkit-appearance: none;
}
.save-btn:disabled { background: var(–border); color: var(–ink5); cursor: default; }
.save-btn:not(:disabled):active { transform: scale(0.97); }

/* SAVED TOAST */
.saved-confirm {
border-radius: 10px;
padding: 12px 16px;
margin-bottom: 16px;
display: flex;
align-items: center;
gap: 10px;
animation: slideDown 0.3s ease;
}
.saved-confirm .cat-emoji { font-size: 22px; }
.saved-confirm .cat-name { font-family: ‘DM Mono’, monospace; font-size: 13px; }
.saved-confirm .cat-sub { font-size: 12px; color: var(–ink4); margin-top: 2px; }

@keyframes slideDown {
from { opacity: 0; transform: translateY(-8px); }
to { opacity: 1; transform: translateY(0); }
}

/* QUICK TAPS */
.section-label {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
letter-spacing: 1.5px;
color: var(–ink4);
text-transform: uppercase;
margin-bottom: 10px;
}
.quick-taps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.quick-tap {
background: var(–white);
border: 1px solid var(–border);
border-radius: 10px;
padding: 13px 16px;
text-align: left;
font-size: 14px;
color: var(–ink2);
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
transition: border-color 0.2s;
-webkit-appearance: none;
}
.quick-tap:active { border-color: var(–border2); background: var(–cream); }

/* RECENT */
.recent-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.recent-card {
background: var(–white);
border: 1px solid var(–border);
border-radius: 10px;
padding: 12px 14px;
display: flex;
gap: 10px;
align-items: flex-start;
}
.recent-emoji { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
.recent-text { font-size: 14px; color: var(–ink); line-height: 1.5; flex: 1; }
.recent-time { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink5); margin-top: 4px; }
.see-all-btn {
background: none; border: none;
color: var(–ink4); font-size: 13px;
cursor: pointer; padding: 8px 0;
font-family: ‘DM Sans’, sans-serif;
font-style: italic;
}

/* NOTES VIEW */
.notes { padding: 16px 20px 0; }
.filter-row {
display: flex;
gap: 8px;
overflow-x: auto;
padding-bottom: 4px;
margin-bottom: 20px;
-webkit-overflow-scrolling: touch;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
padding: 8px 16px;
border-radius: 20px;
border: 1px solid var(–border2);
background: var(–white);
color: var(–ink3);
font-size: 12px;
font-family: ‘DM Mono’, monospace;
cursor: pointer;
white-space: nowrap;
transition: all 0.2s;
-webkit-appearance: none;
}
.filter-btn.active {
background: var(–ink);
border-color: var(–ink);
color: var(–white);
}

.thought-card {
background: var(–white);
border: 1px solid var(–border);
border-radius: 10px;
padding: 14px;
margin-bottom: 10px;
display: flex;
gap: 12px;
align-items: flex-start;
}
.thought-emoji { font-size: 18px; flex-shrink: 0; }
.thought-body { flex: 1; min-width: 0; }
.thought-text { font-size: 14px; color: var(–ink); line-height: 1.6; }
.thought-meta {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 6px;
}
.thought-info { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink5); }
.delete-btn {
background: none; border: none;
color: var(–ink5); font-size: 13px;
cursor: pointer; padding: 0;
line-height: 1;
}

.empty {
text-align: center;
padding: 60px 0;
color: var(–ink5);
font-size: 14px;
font-style: italic;
}

/* BOTTOM NAV */
.bottom-nav {
position: fixed;
bottom: 0; left: 0; right: 0;
background: var(–white);
border-top: 1px solid var(–border);
display: flex;
z-index: 10;
padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
flex: 1;
background: none;
border: none;
border-top: 2px solid transparent;
padding: 10px 4px 12px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
gap: 3px;
-webkit-appearance: none;
}
.nav-btn.active { border-top-color: var(–ink); }
.nav-emoji { font-size: 20px; line-height: 1; }
.nav-label { font-family: ‘DM Mono’, monospace; font-size: 9px; color: var(–ink5); letter-spacing: 0.5px; }
.nav-btn.active .nav-label { color: var(–ink); }

.spacer { height: 80px; }
</style>

</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Mom Brain</div>
      <div class="header-sub" id="thought-count">0 thoughts saved</div>
    </div>
    <div class="view-toggle">
      <button class="toggle-btn active" id="btn-capture" onclick="setView('capture')">✏️ Capture</button>
      <button class="toggle-btn" id="btn-notes" onclick="setView('notes')">📋 Notes</button>
    </div>
  </div>
</div>

<!-- CAPTURE VIEW -->

<div id="view-capture" class="capture">

  <div class="input-card">
    <textarea id="thought-input" placeholder="What's on your mind? Just type it..." onkeydown="handleKey(event)"></textarea>
    <div class="input-footer">
      <div class="input-hint" id="input-hint">Press Enter to save</div>
      <button class="save-btn" id="save-btn" onclick="saveThought()" disabled>Save →</button>
    </div>
  </div>

  <div id="saved-confirm" style="display:none"></div>

  <div class="section-label">Quick starters</div>
  <div class="quick-taps">
    <button class="quick-tap" onclick="quickTap('Grace needs ')">👶 Grace needs…</button>
    <button class="quick-tap" onclick="quickTap('Idea for Citizen Brief: ')">💼 Idea for Citizen Brief…</button>
    <button class="quick-tap" onclick="quickTap('LSAT — remember to ')">📚 LSAT — remember to…</button>
    <button class="quick-tap" onclick="quickTap('I\'m feeling ')">🫀 I'm feeling…</button>
    <button class="quick-tap" onclick="quickTap('Don\'t forget to ')">💡 Don't forget to…</button>
  </div>

  <div id="recent-section" style="display:none">
    <div class="section-label">Recent</div>
    <div class="recent-list" id="recent-list"></div>
    <button class="see-all-btn" id="see-all-btn" onclick="setView('notes')"></button>
  </div>

  <div class="spacer"></div>
</div>

<!-- NOTES VIEW -->

<div id="view-notes" class="notes" style="display:none">
  <div class="filter-row" id="filter-row"></div>
  <div id="notes-list"></div>
  <div class="spacer"></div>
</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-capture" onclick="setView('capture')">
    <span class="nav-emoji">✏️</span>
    <span class="nav-label">CAPTURE</span>
  </button>
  <button class="nav-btn" id="nav-notes" onclick="setView('notes')">
    <span class="nav-emoji">📋</span>
    <span class="nav-label">NOTES</span>
  </button>
</div>

<script>
const CATS = [
  { id:"baby",    emoji:"👶", label:"Baby",     color:"#7EB8A4", bg:"#f0faf6", keys:["grace","feed","feeding","diaper","nap","sleep","bottle","doctor","appointment","milestone","cry","crying","bath","medicine","vaccine","weight","formula","nursing","breast","pump","rash","tooth","teeth","pediatr","daycare","stroller","carrier","pacifier"] },
  { id:"work",    emoji:"💼", label:"Work",     color:"#7B8EC8", bg:"#f0f2fb", keys:["meeting","email","policy","report","deadline","project","colleague","boss","presentation","ilo","ocha","nonprofit","citizen brief","linkedin","client","call","idea for work","job","career","memo","brief","proposal","budget"] },
  { id:"lsat",    emoji:"📚", label:"LSAT",     color:"#C07B5A", bg:"#fdf4ef", keys:["lsat","logic","lr","lg","rc","study","practice","game","reasoning","passage","question","test","score","7sage","prep","section","argument","assumption","flaw","weaken","strengthen","inference"] },
  { id:"feelings",emoji:"🫀", label:"Feelings", color:"#B5506B", bg:"#fdf0f3", keys:["feel","feeling","tired","exhausted","happy","sad","anxious","overwhelmed","grateful","frustrated","proud","worried","scared","excited","lonely","love","stressed","crying","emotion","mood","burnt out","burnout","miss","grateful","thankful"] },
  { id:"random",  emoji:"💡", label:"Random",   color:"#B5856B", bg:"#fdf6f2", keys:[] },
];

let thoughts = [];
let activeFilter = "all";
let currentView = "capture";
let savedTimeout = null;

try { thoughts = JSON.parse(localStorage.getItem("mombrain_v2") || "[]"); } catch {}

function save() {
  try { localStorage.setItem("mombrain_v2", JSON.stringify(thoughts)); } catch {}
}

function getCat(text) {
  const lower = text.toLowerCase();
  for (const c of CATS) {
    if (c.keys.some(k => lower.includes(k))) return c.id;
  }
  return "random";
}

function timeAgo(ts) {
  const d = Date.now() - ts;
  const m = Math.floor(d / 60000);
  const h = Math.floor(d / 3600000);
  const dy = Math.floor(d / 86400000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (h < 24) return h + "h ago";
  return dy + "d ago";
}

function getCatById(id) { return CATS.find(c => c.id === id) || CATS[4]; }

const input = document.getElementById("thought-input");
const saveBtn = document.getElementById("save-btn");
const hint = document.getElementById("input-hint");

input.addEventListener("input", () => {
  const has = input.value.trim().length > 0;
  saveBtn.disabled = !has;
  hint.textContent = has ? "AI will sort this for you" : "Press Enter to save";
});

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveThought(); }
}

function saveThought() {
  const text = input.value.trim();
  if (!text) return;
  saveBtn.textContent = "Sorting...";
  saveBtn.disabled = true;
  setTimeout(() => {
    const cat = getCat(text);
    const t = { id: Date.now(), text, category: cat, ts: Date.now() };
    thoughts.unshift(t);
    save();
    input.value = "";
    saveBtn.textContent = "Save →";
    saveBtn.disabled = true;
    hint.textContent = "Press Enter to save";
    showConfirm(cat);
    renderRecent();
    updateCount();
  }, 500);
}

function showConfirm(catId) {
  const c = getCatById(catId);
  const el = document.getElementById("saved-confirm");
  el.style.display = "flex";
  el.style.background = c.bg;
  el.style.border = "1px solid " + c.color + "44";
  el.innerHTML = `
    <span class="cat-emoji">${c.emoji}</span>
    <div>
      <div class="cat-name" style="color:${c.color}">Saved to ${c.label}</div>
      <div class="cat-sub">AI sorted it automatically</div>
    </div>`;
  if (savedTimeout) clearTimeout(savedTimeout);
  savedTimeout = setTimeout(() => { el.style.display = "none"; }, 2500);
}

function quickTap(text) {
  input.value = text;
  input.focus();
  input.setSelectionRange(text.length, text.length);
  saveBtn.disabled = false;
  hint.textContent = "AI will sort this for you";
}

function deleteThought(id) {
  thoughts = thoughts.filter(t => t.id !== id);
  save();
  renderNotes();
  renderRecent();
  updateCount();
}

function updateCount() {
  const el = document.getElementById("thought-count");
  el.textContent = thoughts.length + " thought" + (thoughts.length !== 1 ? "s" : "") + " saved";
}

function renderRecent() {
  const sec = document.getElementById("recent-section");
  const list = document.getElementById("recent-list");
  const btn = document.getElementById("see-all-btn");
  if (thoughts.length === 0) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  const recent = thoughts.slice(0, 3);
  list.innerHTML = recent.map(t => {
    const c = getCatById(t.category);
    return `<div class="recent-card">
      <span class="recent-emoji">${c.emoji}</span>
      <div>
        <div class="recent-text">${escHtml(t.text)}</div>
        <div class="recent-time">${timeAgo(t.ts)}</div>
      </div>
    </div>`;
  }).join("");
  if (thoughts.length > 3) {
    btn.textContent = "See all " + thoughts.length + " thoughts →";
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
}

function renderNotes() {
  const list = document.getElementById("notes-list");
  const filterRow = document.getElementById("filter-row");

  // Build filters
  const counts = {};
  thoughts.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
  let filterHtml = `<button class="filter-btn ${activeFilter==="all"?"active":""}" onclick="setFilter('all')">All (${thoughts.length})</button>`;
  CATS.forEach(c => {
    if (counts[c.id]) {
      filterHtml += `<button class="filter-btn ${activeFilter===c.id?"active":""}" onclick="setFilter('${c.id}')" style="${activeFilter===c.id?`background:${c.bg};border-color:${c.color};color:${c.color}`:""}">
        ${c.emoji} ${c.label} (${counts[c.id]})
      </button>`;
    }
  });
  filterRow.innerHTML = filterHtml;

  // Filter thoughts
  const filtered = activeFilter === "all" ? thoughts : thoughts.filter(t => t.category === activeFilter);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">No thoughts here yet</div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const c = getCatById(t.category);
    return `<div class="thought-card" style="border-left: 3px solid ${c.color}">
      <span class="thought-emoji">${c.emoji}</span>
      <div class="thought-body">
        <div class="thought-text">${escHtml(t.text)}</div>
        <div class="thought-meta">
          <span class="thought-info">${c.label} · ${timeAgo(t.ts)}</span>
          <button class="delete-btn" onclick="deleteThought(${t.id})">✕</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function setFilter(f) {
  activeFilter = f;
  renderNotes();
}

function setView(v) {
  currentView = v;
  document.getElementById("view-capture").style.display = v === "capture" ? "block" : "none";
  document.getElementById("view-notes").style.display = v === "notes" ? "block" : "none";
  document.getElementById("btn-capture").className = "toggle-btn" + (v === "capture" ? " active" : "");
  document.getElementById("btn-notes").className = "toggle-btn" + (v === "notes" ? " active" : "");
  document.getElementById("nav-capture").className = "nav-btn" + (v === "capture" ? " active" : "");
  document.getElementById("nav-notes").className = "nav-btn" + (v === "notes" ? " active" : "");
  if (v === "notes") renderNotes();
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Init
updateCount();
renderRecent();
</script>

</body>
</html>
