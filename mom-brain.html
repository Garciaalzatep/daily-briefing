<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Mom Brain"/>
<title>Mom Brain — Capture Everything</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #faf8f4;
–white: #ffffff;
–ink: #1c1917;
–ink2: #44403c;
–ink3: #78716c;
–ink4: #a8a29e;
–ink5: #d6d3d1;
–border: #e7e5e4;
–border2: #d6d3d1;
–accent: #059669;
–accent-light: #d1fae5;
}

html, body {
background: var(–bg);
color: var(–ink);
font-family: ‘DM Sans’, sans-serif;
font-weight: 300;
min-height: 100vh;
overscroll-behavior: none;
}

.onboard {
position: fixed;
inset: 0;
background: var(–ink);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 32px 28px;
z-index: 200;
}
.onboard-title {
font-family: ‘Fraunces’, serif;
font-size: 34px;
color: #fff;
text-align: center;
line-height: 1.2;
margin-bottom: 12px;
letter-spacing: -0.5px;
}
.onboard-title em { font-style: italic; color: #6ee7b7; }
.onboard-sub {
font-size: 15px;
color: var(–ink4);
text-align: center;
margin-bottom: 32px;
line-height: 1.6;
max-width: 300px;
}
.onboard-input {
width: 100%;
max-width: 320px;
padding: 14px 16px;
border: 1px solid #3c3836;
border-radius: 10px;
background: #292524;
color: #fff;
font-size: 16px;
font-family: ‘DM Sans’, sans-serif;
outline: none;
margin-bottom: 12px;
text-align: center;
}
.onboard-input::placeholder { color: #57534e; }
.onboard-btn {
width: 100%;
max-width: 320px;
padding: 14px;
background: var(–accent);
color: #fff;
border: none;
border-radius: 10px;
font-size: 15px;
font-weight: 500;
cursor: pointer;
font-family: ‘DM Sans’, sans-serif;
}
.onboard-skip { margin-top: 14px; font-size: 13px; color: #57534e; cursor: pointer; text-decoration: underline; }

.header {
position: sticky; top: 0; z-index: 10;
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 14px 18px 10px;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.header-title { font-family: ‘Fraunces’, serif; font-size: 20px; color: var(–ink); letter-spacing: -0.3px; }
.header-name { font-style: italic; color: var(–accent); }
.header-sub { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); margin-top: 3px; }
.view-toggle { display: flex; gap: 6px; }
.toggle-btn {
padding: 7px 14px; border-radius: 20px;
border: 1px solid var(–border2);
background: transparent; color: var(–ink4);
font-size: 12px; font-family: ‘DM Mono’, monospace; cursor: pointer;
}
.toggle-btn.active { background: var(–ink); border-color: var(–ink); color: #fff; }

.capture { padding: 18px 18px 0; }

.input-card {
background: var(–white);
border: 1.5px solid var(–border);
border-radius: 14px;
padding: 16px;
margin-bottom: 14px;
box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
textarea {
width: 100%; border: none; outline: none; resize: none;
font-size: 16px; color: var(–ink); line-height: 1.6;
min-height: 80px; background: transparent;
font-family: ‘Fraunces’, serif; font-weight: 300;
}
textarea::placeholder { color: var(–ink5); font-style: italic; }

.input-footer {
display: flex; justify-content: space-between;
align-items: center; margin-top: 10px;
padding-top: 10px; border-top: 1px solid var(–border); gap: 10px;
}
.cat-select {
flex: 1; padding: 8px 10px;
border: 1px solid var(–border2); border-radius: 8px;
background: var(–bg); color: var(–ink2);
font-size: 13px; font-family: ‘DM Sans’, sans-serif;
outline: none; -webkit-appearance: none; max-width: 150px;
}
.save-btn {
padding: 10px 20px; border-radius: 10px; border: none;
background: var(–ink); color: #fff;
font-size: 14px; font-family: ‘DM Sans’, sans-serif;
font-weight: 500; cursor: pointer; white-space: nowrap;
}
.save-btn:disabled { background: var(–border); color: var(–ink4); cursor: default; }

.saved-banner {
border-radius: 10px; padding: 11px 14px;
margin-bottom: 14px;
display: flex; align-items: center; gap: 10px;
background: var(–accent-light); border: 1px solid #6ee7b7;
animation: slideDown 0.3s ease;
}
.saved-banner-text { font-size: 13px; color: #065f46; font-family: ‘DM Mono’, monospace; }

@keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

.section-label {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 1.5px; color: var(–ink4);
text-transform: uppercase; margin-bottom: 10px;
}

.quick-taps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.quick-tap {
background: var(–white); border: 1px solid var(–border);
border-radius: 10px; padding: 12px 16px;
text-align: left; font-size: 14px; color: var(–ink2);
cursor: pointer; font-family: ‘DM Sans’, sans-serif;
display: flex; align-items: center; gap: 10px;
}
.quick-tap:active { background: var(–bg); }

.cat-panel {
background: var(–white); border: 1px solid var(–border);
border-radius: 14px; padding: 14px; margin-bottom: 14px;
}
.cat-panel-title {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 1.5px; color: var(–ink4);
text-transform: uppercase; margin-bottom: 10px;
}
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-chip {
display: flex; align-items: center; gap: 6px;
padding: 6px 12px; border-radius: 20px;
border: 1px solid var(–border2); background: var(–bg);
font-size: 13px; color: var(–ink2);
}
.cat-chip-del { background: none; border: none; color: var(–ink4); font-size: 12px; cursor: pointer; padding: 0; }

.add-cat-row { display: flex; gap: 8px; margin-top: 12px; }
.add-cat-input {
flex: 1; padding: 10px 12px;
border: 1px solid var(–border2); border-radius: 8px;
font-size: 14px; font-family: ‘DM Sans’, sans-serif;
background: var(–white); color: var(–ink); outline: none;
}
.add-cat-btn {
padding: 10px 16px; background: var(–white);
border: 1px solid var(–border2); border-radius: 8px;
font-size: 13px; color: var(–accent);
cursor: pointer; font-family: ‘DM Mono’, monospace; white-space: nowrap;
}

.recent-card {
background: var(–white); border: 1px solid var(–border);
border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
display: flex; gap: 10px; align-items: flex-start;
}
.recent-text { font-size: 14px; color: var(–ink); line-height: 1.5; flex: 1; font-family: ‘Fraunces’, serif; font-weight: 300; }
.recent-time { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink5); margin-top: 4px; }
.see-all-btn { background: none; border: none; color: var(–ink4); font-size: 13px; cursor: pointer; padding: 8px 0; font-style: italic; }

.notes { padding: 16px 18px 0; }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
padding: 8px 14px; border-radius: 20px;
border: 1px solid var(–border2); background: var(–white);
color: var(–ink3); font-size: 12px;
font-family: ‘DM Mono’, monospace; cursor: pointer; white-space: nowrap;
}
.filter-btn.active { background: var(–ink); border-color: var(–ink); color: #fff; }

.thought-card {
background: var(–white); border: 1px solid var(–border);
border-left: 3px solid var(–ink5); border-radius: 10px;
padding: 14px; margin-bottom: 10px;
}
.thought-text { font-size: 15px; color: var(–ink); line-height: 1.6; font-family: ‘Fraunces’, serif; font-weight: 300; }
.thought-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.thought-info { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink5); }
.delete-btn { background: none; border: none; color: var(–ink5); font-size: 13px; cursor: pointer; }
.empty { text-align: center; padding: 60px 0; color: var(–ink4); font-size: 15px; font-style: italic; font-family: ‘Fraunces’, serif; }

.bottom-nav {
position: fixed; bottom: 0; left: 0; right: 0;
background: var(–white); border-top: 1px solid var(–border);
display: flex; z-index: 10;
padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
flex: 1; background: none; border: none;
border-top: 2px solid transparent;
padding: 10px 4px 12px; cursor: pointer;
display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-btn.active { border-top-color: var(–ink); }
.nav-emoji { font-size: 20px; line-height: 1; }
.nav-label { font-family: ‘DM Mono’, monospace; font-size: 9px; color: var(–ink4); letter-spacing: 0.5px; }
.nav-btn.active .nav-label { color: var(–ink); }

.spacer { height: 90px; }
</style>

</head>
<body>

<div class="onboard" id="onboard">
  <div class="onboard-title">Hi mama. 👋<br/>This is your<br/><em>brain dump</em> app.</div>
  <div class="onboard-sub">Type any thought before it disappears. Pick a category. Done. What's your name?</div>
  <input class="onboard-input" id="name-input" type="text" placeholder="Your first name" maxlength="20"/>
  <button class="onboard-btn" onclick="finishOnboard()">Let's go →</button>
  <div class="onboard-skip" onclick="finishOnboard()">Skip for now</div>
</div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Mom Brain <span class="header-name" id="header-name"></span></div>
      <div class="header-sub" id="thought-count">0 thoughts saved</div>
    </div>
    <div class="view-toggle">
      <button class="toggle-btn active" id="btn-capture" onclick="setView('capture')">✏️ Capture</button>
      <button class="toggle-btn" id="btn-notes" onclick="setView('notes')">📋 Notes</button>
    </div>
  </div>
</div>

<div id="view-capture" class="capture">
  <div class="input-card">
    <textarea id="thought-input" placeholder="What's on your mind? Just type it…" onkeydown="handleKey(event)"></textarea>
    <div class="input-footer">
      <select class="cat-select" id="cat-select"></select>
      <button class="save-btn" id="save-btn" onclick="saveThought()" disabled>Save →</button>
    </div>
  </div>

  <div id="saved-banner" style="display:none">
    <div class="saved-banner">
      <span style="font-size:18px">✓</span>
      <span class="saved-banner-text" id="saved-text">Saved!</span>
    </div>
  </div>

  <div class="section-label">Quick starters</div>
  <div class="quick-taps" id="quick-taps"></div>

  <div class="cat-panel">
    <div class="cat-panel-title">My Categories</div>
    <div class="cat-chips" id="cat-chips"></div>
    <div class="add-cat-row">
      <input class="add-cat-input" id="new-cat-input" type="text" placeholder="Add a category…" maxlength="20" onkeydown="if(event.key==='Enter')addCategory()"/>
      <button class="add-cat-btn" onclick="addCategory()">+ Add</button>
    </div>
  </div>

  <div id="recent-section" style="display:none">
    <div class="section-label">Recent</div>
    <div id="recent-list"></div>
    <button class="see-all-btn" id="see-all-btn" onclick="setView('notes')"></button>
  </div>

  <div class="spacer"></div>
</div>

<div id="view-notes" class="notes" style="display:none">
  <div class="filter-row" id="filter-row"></div>
  <div id="notes-list"></div>
  <div class="spacer"></div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-capture" onclick="setView('capture')">
    <span class="nav-emoji">✏️</span>
    <span class="nav-label">CAPTURE</span>
  </button>
  <button class="nav-btn" id="nav-notes" onclick="setView('notes')">
    <span class="nav-emoji">📋</span>
    <span class="nav-label">NOTES</span>
  </button>
</div>

<script>
let userName = "", thoughts = [], categories = [], activeFilter = "all", savedTimeout = null;

const DEFAULT_CATS = [
  { id:"baby",     emoji:"👶", label:"Baby" },
  { id:"feelings", emoji:"🫀", label:"Feelings" },
  { id:"todo",     emoji:"✅", label:"To Do" },
  { id:"ideas",    emoji:"💡", label:"Ideas" },
];

const QUICK_STARTERS = [
  { emoji:"👶", text:"My baby needs " },
  { emoji:"🫀", text:"I'm feeling " },
  { emoji:"✅", text:"Don't forget to " },
  { emoji:"💡", text:"I had an idea: " },
  { emoji:"📞", text:"I need to call " },
];

const CAT_COLORS = ["#6ee7b7","#93c5fd","#fca5a5","#fcd34d","#c4b5fd","#f9a8d4","#86efac","#fdba74"];

function load() {
  try {
    userName   = localStorage.getItem("mb_name") || "";
    thoughts   = JSON.parse(localStorage.getItem("mb_thoughts") || "[]");
    const sc   = JSON.parse(localStorage.getItem("mb_cats") || "null");
    categories = sc || DEFAULT_CATS.map(c=>({...c}));
  } catch { thoughts=[]; categories=DEFAULT_CATS.map(c=>({...c})); }
}

function persist() {
  try {
    localStorage.setItem("mb_name", userName);
    localStorage.setItem("mb_thoughts", JSON.stringify(thoughts));
    localStorage.setItem("mb_cats", JSON.stringify(categories));
  } catch {}
}

function getCatById(id) { return categories.find(c=>c.id===id)||{emoji:"💬",label:"General",id:"general"}; }
function catColor(id) { const i=(id.charCodeAt(id.length-1)||0)%CAT_COLORS.length; return CAT_COLORS[i]; }

function finishOnboard() {
  const v = document.getElementById("name-input").value.trim();
  if (v) userName = v;
  persist();
  document.getElementById("onboard").style.display = "none";
  renderAll();
}

function addCategory() {
  const input = document.getElementById("new-cat-input");
  const label = input.value.trim();
  if (!label) return;
  const emojis = ["🌸","⭐","🔥","🎯","📌","🧠","💬","🏃","🛒","📚","🎀","🍼","💊","🏥","🎵"];
  const emoji = emojis[categories.length % emojis.length];
  categories.push({ id:"cat_"+Date.now(), emoji, label });
  persist(); input.value = "";
  renderCategories(); renderCatSelect();
}

function deleteCategory(id) {
  categories = categories.filter(c=>c.id!==id);
  persist(); renderCategories(); renderCatSelect();
}

function renderCategories() {
  document.getElementById("cat-chips").innerHTML = categories.map(c=>`
    <div class="cat-chip">
      <span>${c.emoji}</span><span>${c.label}</span>
      <button class="cat-chip-del" onclick="deleteCategory('${c.id}')">✕</button>
    </div>`).join("");
}

function renderCatSelect() {
  document.getElementById("cat-select").innerHTML = categories.map(c=>
    `<option value="${c.id}">${c.emoji} ${c.label}</option>`).join("");
}

function renderQuickTaps() {
  document.getElementById("quick-taps").innerHTML = QUICK_STARTERS.map(q=>`
    <button class="quick-tap" onclick="quickTap('${q.text.replace(/'/g,"\\'")}')">
      <span>${q.emoji}</span><span>${q.text}</span>
    </button>`).join("");
}

const inp = document.getElementById("thought-input");
const saveBtn = document.getElementById("save-btn");
inp.addEventListener("input", ()=>{ saveBtn.disabled = !inp.value.trim(); });

function handleKey(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveThought();} }

function quickTap(text) {
  inp.value = text; inp.focus();
  inp.setSelectionRange(text.length,text.length);
  saveBtn.disabled = false;
}

function saveThought() {
  const text = inp.value.trim(); if(!text) return;
  const catId = document.getElementById("cat-select").value;
  thoughts.unshift({ id:Date.now(), text, category:catId, ts:Date.now() });
  persist(); inp.value=""; saveBtn.disabled=true;
  showSaved(catId); renderRecent(); updateCount();
}

function showSaved(catId) {
  const c = getCatById(catId);
  const el = document.getElementById("saved-banner");
  document.getElementById("saved-text").textContent = "Saved to "+c.emoji+" "+c.label;
  el.style.display="block";
  if(savedTimeout) clearTimeout(savedTimeout);
  savedTimeout = setTimeout(()=>{ el.style.display="none"; }, 2500);
}

function deleteThought(id) {
  thoughts = thoughts.filter(t=>t.id!==id);
  persist(); renderNotes(); renderRecent(); updateCount();
}

function updateCount() {
  document.getElementById("thought-count").textContent =
    thoughts.length + " thought"+(thoughts.length!==1?"s":"")+" saved";
}

function timeAgo(ts) {
  const d=Date.now()-ts, m=Math.floor(d/60000), h=Math.floor(d/3600000), dy=Math.floor(d/86400000);
  if(m<1) return "just now"; if(m<60) return m+"m ago"; if(h<24) return h+"h ago"; return dy+"d ago";
}

function renderRecent() {
  const sec=document.getElementById("recent-section");
  const list=document.getElementById("recent-list");
  const btn=document.getElementById("see-all-btn");
  if(!thoughts.length){sec.style.display="none";return;}
  sec.style.display="block";
  list.innerHTML = thoughts.slice(0,3).map(t=>{
    const c=getCatById(t.category);
    return `<div class="recent-card">
      <span style="font-size:16px;flex-shrink:0;margin-top:2px">${c.emoji}</span>
      <div>
        <div class="recent-text">${escHtml(t.text)}</div>
        <div class="recent-time">${c.label} · ${timeAgo(t.ts)}</div>
      </div>
    </div>`;
  }).join("");
  btn.textContent = thoughts.length>3 ? "See all "+thoughts.length+" thoughts →" : "";
  btn.style.display = thoughts.length>3?"block":"none";
}

function renderNotes() {
  const list=document.getElementById("notes-list");
  const filterRow=document.getElementById("filter-row");
  const counts={};
  thoughts.forEach(t=>{ counts[t.category]=(counts[t.category]||0)+1; });
  let fh=`<button class="filter-btn ${activeFilter==="all"?"active":""}" onclick="setFilter('all')">All (${thoughts.length})</button>`;
  categories.forEach(c=>{
    if(counts[c.id]) fh+=`<button class="filter-btn ${activeFilter===c.id?"active":""}" onclick="setFilter('${c.id}')">${c.emoji} ${c.label} (${counts[c.id]})</button>`;
  });
  filterRow.innerHTML=fh;
  const filtered = activeFilter==="all" ? thoughts : thoughts.filter(t=>t.category===activeFilter);
  if(!filtered.length){list.innerHTML=`<div class="empty">Nothing here yet.</div>`;return;}
  list.innerHTML=filtered.map(t=>{
    const c=getCatById(t.category);
    return `<div class="thought-card" style="border-left-color:${catColor(c.id)}">
      <div class="thought-text">${escHtml(t.text)}</div>
      <div class="thought-meta">
        <span class="thought-info">${c.emoji} ${c.label} · ${timeAgo(t.ts)}</span>
        <button class="delete-btn" onclick="deleteThought(${t.id})">✕</button>
      </div>
    </div>`;
  }).join("");
}

function setFilter(f){activeFilter=f;renderNotes();}

function setView(v) {
  document.getElementById("view-capture").style.display=v==="capture"?"block":"none";
  document.getElementById("view-notes").style.display=v==="notes"?"block":"none";
  document.getElementById("btn-capture").className="toggle-btn"+(v==="capture"?" active":"");
  document.getElementById("btn-notes").className="toggle-btn"+(v==="notes"?" active":"");
  document.getElementById("nav-capture").className="nav-btn"+(v==="capture"?" active":"");
  document.getElementById("nav-notes").className="nav-btn"+(v==="notes"?" active":"");
  if(v==="notes") renderNotes();
}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function renderAll() {
  document.getElementById("header-name").textContent = userName ? "· "+userName : "";
  renderCategories(); renderCatSelect(); renderQuickTaps(); renderRecent(); updateCount();
}

load();
if(userName){ document.getElementById("onboard").style.display="none"; renderAll(); }
</script>

</body>
</html>
