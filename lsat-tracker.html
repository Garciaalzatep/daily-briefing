<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="LSAT Tracker"/>
<title>LSAT Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #faf8f4;
–white: #ffffff;
–ink: #1c1917;
–ink2: #44403c;
–ink3: #78716c;
–ink4: #a8a29e;
–ink5: #d6d3d1;
–border: #e7e5e4;
–border2: #d6d3d1;

/* Phase colors - light & readable */
–c1: #059669; /* Foundation - green */
–c2: #2563eb; /* Core Skills - blue */
–c3: #d97706; /* Timed - amber */
–c4: #dc2626; /* Full Test - red */
–c5: #7c3aed; /* Final - purple */
}

html, body {
background: var(–bg);
color: var(–ink);
font-family: ‘DM Sans’, sans-serif;
font-weight: 300;
min-height: 100vh;
overscroll-behavior: none;
}

/* HEADER */
.header {
position: sticky; top: 0; z-index: 10;
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 14px 18px 12px;
}
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.header-title { font-family: ‘Fraunces’, serif; font-size: 20px; color: var(–ink); letter-spacing: -0.3px; }
.header-sub { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); margin-top: 3px; }
.pct-block { text-align: right; }
.pct-num { font-family: ‘Fraunces’, serif; font-size: 28px; line-height: 1; }
.pct-label { font-family: ‘DM Mono’, monospace; font-size: 9px; color: var(–ink4); margin-top: 2px; }
.progress-bar { background: var(–border); border-radius: 4px; height: 3px; margin-top: 10px; }
.progress-fill { height: 3px; border-radius: 4px; transition: width 0.4s; }

/* PHASE BANNER */
.phase-banner {
background: var(–white);
border-bottom: 1px solid var(–border);
padding: 12px 18px;
cursor: pointer;
}
.phase-banner-top { display: flex; justify-content: space-between; align-items: center; }
.phase-name { font-family: ‘Fraunces’, serif; font-size: 16px; color: var(–ink); }
.phase-dates { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); margin-top: 3px; }
.phase-switch { font-family: ‘DM Mono’, monospace; font-size: 12px; color: var(–ink4); }
.phase-focus {
font-size: 13px; color: var(–ink3);
margin-top: 8px; line-height: 1.5;
font-style: italic;
padding: 10px 12px;
background: var(–bg);
border-radius: 8px;
border-left: 3px solid var(–ink5);
}

/* PHASE MENU */
.phase-menu { display: none; background: var(–white); border-bottom: 1px solid var(–border); }
.phase-menu.open { display: block; }
.phase-option {
display: flex; align-items: center; gap: 14px;
padding: 14px 18px; border-bottom: 1px solid var(–border);
cursor: pointer; min-height: 58px;
}
.phase-option:active { background: var(–bg); }
.phase-option .p-emoji { font-size: 20px; }
.phase-option .p-name { font-size: 14px; color: var(–ink2); }
.phase-option .p-dates { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); margin-top: 2px; }
.phase-option .p-check { margin-left: auto; font-size: 14px; }

/* WEEK CARDS */
.weeks { padding: 14px 14px 0; }

.week-card {
background: var(–white);
border: 1px solid var(–border);
border-radius: 12px;
margin-bottom: 12px;
overflow: hidden;
}

.week-header {
display: flex; align-items: center; gap: 12px;
padding: 14px 16px; cursor: pointer;
min-height: 60px;
}

.week-checkbox {
width: 26px; height: 26px; border-radius: 50%;
border: 2px solid var(–border2);
background: transparent; flex-shrink: 0;
display: flex; align-items: center; justify-content: center;
font-size: 13px; cursor: pointer;
transition: all 0.2s; -webkit-appearance: none;
}
.week-checkbox.done { color: white; }

.week-info { flex: 1; min-width: 0; }
.week-label {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 1px; color: var(–ink4); margin-bottom: 4px;
}
.week-label.today { font-weight: 500; }
.week-task { font-size: 14px; color: var(–ink2); line-height: 1.4; }
.week-time { font-family: ‘DM Mono’, monospace; font-size: 10px; color: var(–ink4); flex-shrink: 0; }
.expand-arrow { color: var(–ink5); font-size: 11px; flex-shrink: 0; margin-left: 4px; }

/* EXPANDED DETAIL */
.week-detail {
display: none;
border-top: 1px solid var(–border);
padding: 16px 16px 18px;
background: var(–bg);
}
.week-detail.open { display: block; }

.detail-section { margin-bottom: 16px; }
.detail-section:last-child { margin-bottom: 0; }

.detail-heading {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 1.5px; color: var(–ink4);
text-transform: uppercase; margin-bottom: 8px;
}

.detail-text {
font-size: 14px; color: var(–ink2);
line-height: 1.7;
}

.khan-link {
display: inline-flex; align-items: center; gap: 6px;
margin-top: 10px; padding: 8px 14px;
background: var(–white); border: 1px solid var(–border2);
border-radius: 8px; font-size: 13px; color: var(–ink2);
text-decoration: none; font-family: ‘DM Mono’, monospace;
}
.khan-link:active { background: var(–border); }

.tip-box {
background: var(–white);
border: 1px solid var(–border);
border-radius: 8px;
padding: 10px 12px;
font-size: 13px;
color: var(–ink3);
line-height: 1.6;
margin-top: 8px;
}
.tip-box strong { color: var(–ink2); }

.steps { display: flex; flex-direction: column; gap: 8px; }
.step {
display: flex; gap: 10px; align-items: flex-start;
}
.step-num {
width: 22px; height: 22px; border-radius: 50%;
background: var(–ink); color: white;
font-family: ‘DM Mono’, monospace; font-size: 11px;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0; margin-top: 1px;
}
.step-text { font-size: 13px; color: var(–ink2); line-height: 1.6; flex: 1; }

/* TIP */
.bottom-tip {
margin: 4px 14px 16px;
padding: 12px 14px;
background: var(–white);
border: 1px solid var(–border);
border-radius: 10px;
font-size: 13px; color: var(–ink4); line-height: 1.6;
}
.bottom-tip strong { color: var(–ink3); }

/* BOTTOM NAV */
.bottom-nav {
position: fixed; bottom: 0; left: 0; right: 0;
background: var(–white); border-top: 1px solid var(–border);
display: flex; z-index: 10;
padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
flex: 1; background: none; border: none;
border-top: 2px solid transparent;
padding: 10px 2px 12px; cursor: pointer;
display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-btn.active { border-top-color: var(–ink); }
.nav-emoji { font-size: 18px; line-height: 1; }
.nav-label { font-family: ‘DM Mono’, monospace; font-size: 8px; color: var(–ink4); letter-spacing: 0.3px; }
.nav-btn.active .nav-label { color: var(–ink); }

.spacer { height: 80px; }
</style>

</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">LSAT Study Tracker</div>
      <div class="header-sub">30–45 min/day · Khan Academy · Aug 2026</div>
    </div>
    <div class="pct-block">
      <div class="pct-num" id="pct-num">0%</div>
      <div class="pct-label">complete</div>

  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="phase-banner" id="phase-banner" onclick="toggleMenu()">
  <div class="phase-banner-top">
    <div>
      <div class="phase-name" id="phase-name"></div>
      <div class="phase-dates" id="phase-dates"></div>
    </div>
    <div class="phase-switch">Switch ▾</div>

  <div class="phase-focus" id="phase-focus"></div>
</div>

<div class="phase-menu" id="phase-menu"></div>
<div class="weeks" id="weeks-list"></div>
<div class="bottom-tip">💡 <strong>Missed a day?</strong> Don't catch up — just do today's task. Progress beats perfection every time.</div>
<div class="spacer"></div>
<div class="bottom-nav" id="bottom-nav"></div>

let activePhase = 0;
let completed = {};
let expandedKey = null;
let menuOpen = false;

try { completed = JSON.parse(localStorage.getItem("lsat_v3") || "{}"); } catch {}

function save() { try { localStorage.setItem("lsat_v3", JSON.stringify(completed)); } catch {} }

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById("phase-menu").className = "phase-menu" + (menuOpen ? " open" : "");
}

function setPhase(i) {
  activePhase = i; menuOpen = false; expandedKey = null; render();
}

function toggleDone(phaseId, idx, e) {
  e.stopPropagation();
  const k = phaseId+"-"+idx;
  completed[k] = !completed[k];
  save(); render();
}

function toggleExpand(key) {
  expandedKey = expandedKey === key ? null : key;
  render();
}

function render() {
  const phase = PHASES[activePhase];
  const color = phase.color;

  // Progress
  const studyDays = phase.days.filter(d => d.time !== "—");
  const done = studyDays.filter((d,i) => completed[phase.id+"-"+i]).length;
  const pct = studyDays.length ? Math.round(done/studyDays.length*100) : 0;
  document.getElementById("pct-num").textContent = pct+"%";
  document.getElementById("pct-num").style.color = color;
  document.getElementById("progress-fill").style.width = pct+"%";
  document.getElementById("progress-fill").style.background = color;

  // Phase banner
  document.getElementById("phase-name").textContent = phase.name;
  document.getElementById("phase-dates").textContent = phase.weeks+" · "+phase.dates;
  document.getElementById("phase-focus").textContent = phase.focus;

  // Phase menu
  document.getElementById("phase-menu").className = "phase-menu"+(menuOpen?" open":"");
  document.getElementById("phase-menu").innerHTML = PHASES.map((p,i) => `
    <div class="phase-option" onclick="setPhase(${i})">
      <span class="p-emoji">${p.emoji}</span>
      <div>
        <div class="p-name" style="color:${i===activePhase?p.color:"#44403c"}">${p.name}</div>
        <div class="p-dates">${p.dates}</div>
      </div>
      ${i===activePhase?`<div class="p-check" style="color:${p.color}">✓</div>`:""}
    </div>`).join("");

  // Week cards
  document.getElementById("weeks-list").innerHTML = phase.days.map((d,i) => {
    const k = phase.id+"-"+i;
    const isDone = !!completed[k];
    const isToday = d.day === todayName;
    const isRest = d.time === "—";
    const isExp = expandedKey === k;

    const cardStyle = isToday
      ? `border-color:${color}; box-shadow:0 0 0 1px ${color}22;`
      : "";

    const checkStyle = isDone
      ? `background:${color};border-color:${color};`
      : isToday ? `border-color:${color};` : "";

    return `
    <div class="week-card" style="${cardStyle}">
      <div class="week-header" onclick="toggleExpand('${k}')">
        ${!isRest ? `
          <button class="week-checkbox${isDone?" done":""}" style="${checkStyle}" onclick="toggleDone(${phase.id},${i},event)">
            ${isDone?"✓":""}
          </button>` : `<div style="width:26px;flex-shrink:0;text-align:center;font-size:18px">🛁</div>`
        }
        <div class="week-info">
          <div class="week-label${isToday?" today":""}" style="${isToday?`color:${color}`:""}">
            ${d.day.toUpperCase()}${isToday?" · TODAY":""}
          </div>
          <div class="week-task" style="${isDone?"color:#a8a29e;text-decoration:line-through":""}">${d.task}</div>
        </div>
        <div class="week-time">${d.time}</div>
        <div class="expand-arrow">${isExp?"▲":"▼"}</div>
      </div>

      ${isExp ? `
      <div class="week-detail open">
        <div class="detail-section">
          <div class="detail-heading">What you're doing</div>
          <div class="detail-text">${d.what}</div>
        </div>

        ${d.steps.length ? `
        <div class="detail-section">
          <div class="detail-heading">Exactly how to do it</div>
          <div class="steps">
            ${d.steps.map((s,n)=>`
              <div class="step">
                <div class="step-num">${n+1}</div>
                <div class="step-text">${s}</div>
              </div>`).join("")}
          </div>
        </div>` : ""}

        ${d.khan ? `
        <div class="detail-section">
          <div class="detail-heading">Where to go</div>
          <a class="khan-link" href="${d.khan}" target="_blank">📚 Open Khan Academy LSAT →</a>
        </div>` : ""}

        <div class="tip-box">💡 <strong>Study tip:</strong> ${d.tip}</div>
      </div>` : ""}
    </div>`;
  }).join("");

  // Bottom nav
  document.getElementById("bottom-nav").innerHTML = PHASES.map((p,i) => `
    <button class="nav-btn${i===activePhase?" active":""}" onclick="setPhase(${i})" style="${i===activePhase?`border-top-color:${p.color}`:""}">
      <span class="nav-emoji">${p.emoji}</span>
      <span class="nav-label" style="${i===activePhase?`color:${p.color}`:""}">${p.short}</span>
    </button>`).join("");
}

render();
</script>
